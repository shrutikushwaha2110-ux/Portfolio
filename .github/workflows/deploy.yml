name: Deploy frontend to GitHub Pages

# Builds client/ and publishes it to GitHub Pages on every push to main.
# The backend (server/) is NOT deployed by this workflow — see server/README
# or the root README for deploying it separately (e.g. to Render).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          # IMPORTANT: must match the GitHub repository name (case-sensitive),
          # wrapped in slashes. Repo is "Portfolio" (capital P). If you rename
          # the repo, update this value. See client/vite.config.ts.
          VITE_BASE_PATH: /Portfolio/
          # Point the production build at your deployed backend so the AI
          # chatbot works live. Set this repo's Actions variable
          # VITE_API_BASE_URL (Settings -> Secrets and variables -> Actions
          # -> Variables) to your Render backend URL, e.g.
          # https://your-backend.onrender.com. Leave it unset and the site
          # still works, but the chatbot will fail to reach a backend.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
